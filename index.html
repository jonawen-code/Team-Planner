<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Planner v1.19 Build 01E</title>
<style>
:root{
  --red:#d50022;--red-dark:#b0001a;--ink:#1e293b;--muted:#64748b;--line:#cbd5e1;--bg:#f1f5f9;--panel:#fff;
  --holiday-bg:#cbd5e1;
  --weekend-bg:#e2e8f0;
  --workday-bg:#ffffff;
  --adjusted-workday:#fef3c7;
  --col-w: 48px;
  --label-w: 140px;
  --item-font-size: 11px;
}
*{box-sizing:border-box} 
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);user-select:none}

header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:50}
.logo-box{display:flex;align-items:center;height:36px}
.logo-box img{height:32px;object-fit:contain}
.header-title-box{margin-left:4px}
.title{font-weight:800;font-size:18px;color:#0f172a}
.subtitle{color:var(--muted);font-size:12px;margin-top:2px}
.spacer{flex:1}

button,select,input,textarea{font:inherit} 
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;color:#334155;transition:all .15s}
button:hover{background:#f8fafc;border-color:#94a3b8;color:#0f172a}
.primary{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.primary:hover{background:var(--red-dark);border-color:var(--red-dark);color:#fff}
.danger{color:#dc2626;border-color:#fecaca}
.danger:hover{background:#fef2f2;border-color:#f87171}
.icon-btn{padding:6px 10px;display:flex;align-items:center;gap:5px}

.toolbar{background:#fff;padding:8px 24px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:64px;z-index:45}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px}
.seg button.active{background:#0f172a;color:#fff}
.nav-year{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
.nav-year button{padding:4px 9px}
.year-select{padding:5px 28px 5px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:800;color:#0f172a}
.nav-month{display:flex;align-items:center;gap:6px;font-weight:700}
.nav-month button{padding:4px 9px}
#monthLabel{min-width:42px;text-align:center}
.search{padding:6px 11px;border:1px solid var(--line);border-radius:6px;min-width:190px}
.lang-select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:600;color:#334155;font-size:12px;cursor:pointer}

.ctrl-pill{display:flex;align-items:center;gap:4px;background:#f8fafc;padding:3px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px}
.ctrl-pill span{color:var(--muted);font-weight:600}
.ctrl-btn{padding:2px 7px;font-size:11px;font-weight:700;line-height:1}
.toggle-btn{padding:3px 9px;font-size:11px;font-weight:600;border-radius:4px;border:1px solid var(--line);background:#fff;cursor:pointer}
.toggle-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}

main{padding:14px 24px 40px}

.team-toggles-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;background:#fff;padding:8px 16px;border-radius:8px;border:1px solid var(--line)}
.toggle-title{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px}
.team-pill-btn{
  display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
  border:1px solid var(--line);background:#f8fafc;color:#64748b;cursor:pointer;transition:all .15s
}
.team-pill-btn.active{color:#fff;border-color:transparent}
.team-pill-btn .check-icon{font-size:11px}

.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;background:#fff;padding:7px 16px;border-radius:8px;border:1px solid var(--line);font-size:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-weight:500}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.status-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:4px;background:#f8fafc;border:1px solid var(--line)}
.status-box{width:14px;height:12px;border-radius:2px;background:#94a3b8}
.hint{margin-left:auto;color:var(--muted);font-size:12px}

.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.03);overflow:hidden}
.card-head{padding:10px 18px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#fafafa}
.card-head h2{font-size:15px;margin:0;font-weight:700}
.card-head small{color:var(--muted);margin-left:10px}

.scroll{overflow:auto}
.year-grid{display:grid;grid-template-columns:140px repeat(12,minmax(90px,1fr));min-width:1220px}
.cell{min-height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;position:relative}
.headcell{min-height:36px;background:#f1f5f9;font-weight:700;text-align:center;padding:9px 4px;position:sticky;top:0;z-index:4;color:#475569;font-size:13px}
.teamcell{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;background:#f8fafc;position:sticky;left:0;z-index:3;border-right:2px solid var(--line)}

.event-pill{
  color:#fff;border-radius:4px;padding:4px 7px;margin:3px 0;font-size:11px;line-height:1.3;
  cursor:pointer;box-shadow:0 2px 6px rgba(15,23,42,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-sizing:border-box;
}
.event-pill.light{color:#1e293b}
.event-pill.status-confirmed{border-left:3px solid var(--confirmed-border) !important}
.event-pill.status-planned{border-left:5px solid transparent !important}

.month-wrap{overflow:auto;position:relative;background:#fff}
.grid-calendar{
  display: grid;
  grid-template-columns: var(--label-w) repeat(var(--total-days), var(--col-w));
  border-left: 1px solid var(--line);
  border-top: 1px solid var(--line);
  width: max-content;
}
.g-cell{border-right: 1px solid var(--line);border-bottom: 1px solid var(--line);display: flex;align-items: center;justify-content: center;position: relative;}
.g-corner{grid-column: 1;grid-row: 1;position: sticky;left: 0;top: 0;z-index: 35;background: #e2e8f0;font-weight: 700;font-size: 13px;height: 76px;}
.g-day-th{grid-row: 1;position: sticky;top: 0;z-index: 30;background: #f1f5f9;height: 76px;font-size: 11px;color: #475569;flex-direction: column;padding: 4px 2px;}
.g-day-th b{display:block;font-size:14px;color:#0f172a}
.g-day-th.weekend{background:var(--weekend-bg)}
.g-day-th.holiday{background:var(--holiday-bg);color:#991b1b;font-weight:700}
.g-day-th.workday-adjusted{background:var(--adjusted-workday);color:#92400e}
.day-badge{font-size:10px;font-weight:700;line-height:1;margin-top:2px;display:block}

.g-team-label{grid-column: 1;position: sticky;left: 0;z-index: 25;background: #f8fafc;font-weight: 700;font-size: 13px;padding: 0 12px;justify-content: flex-start;gap: 8px;border-right: 2px solid var(--line);}

.g-day-bg{cursor: crosshair;background: #fff;height: 100%;}
.g-day-bg.weekend{background:rgba(226,232,240,0.65)}
.g-day-bg.holiday{background:rgba(203,213,225,0.95)}
.g-day-bg.workday-adjusted{background:rgba(254,243,199,0.5)}
.g-day-bg.drag-selecting{background:rgba(213,0,34,0.3) !important}
.g-day-bg.drag-target-hover{background:rgba(59,130,246,0.35) !important}

.g-event-card{
  height: calc(100% - 8px);align-self: center;border-radius: 5px;color: #fff;font-size: var(--item-font-size);
  display: flex;align-items: center;padding: 0 6px;margin-left: 1px;margin-right: 1px;
  box-shadow: 0 2px 6px rgba(15,23,42,0.16);cursor: grab;z-index: 10;box-sizing: border-box;
  margin-top: 4px;margin-bottom: 4px;transition: filter .15s, transform .1s;
}
.g-event-card:active{cursor:grabbing}
.g-event-card:hover{filter:brightness(0.92);transform:translateY(-1px);box-shadow:0 3px 6px rgba(0,0,0,0.22);}
.g-event-card.light{color:#1e293b}

.g-event-card.status-confirmed{border-left:3px solid var(--confirmed-border) !important}
.g-event-card.status-planned{border-left:5px solid transparent !important}

.font-bold-mode{font-weight:700 !important}
.font-normal-mode{font-weight:500 !important}

.event-text.ellipsis-mode{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:left;}
.event-text.wrap-mode{white-space:normal;word-break:normal;overflow-wrap:normal;hyphens:none;line-height:1.2;text-align:center;width:100%;}

#hoverPopover{
  position:fixed;display:none;z-index:999;background:#ffffff;color:#1e293b;border-radius:8px;
  padding:12px 14px;box-shadow:0 12px 28px -4px rgba(0,0,0,0.18), 0 4px 12px -2px rgba(0,0,0,0.08);
  border:1px solid #e2e8f0;border-left:4px solid var(--red);max-width:320px;min-width:180px;
  pointer-events:none;transition:opacity .12s ease, transform .12s ease;opacity:0;transform:translateY(4px);
}
#hoverPopover.show{opacity:1;transform:translateY(0);}
.popover-title{font-weight:700;font-size:13px;color:#0f172a;margin-bottom:6px;line-height:1.3;}
.popover-meta{font-size:11px;color:#64748b;display:flex;flex-direction:column;gap:3px;}
.popover-meta span b{color:#334155;font-weight:600}
.popover-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;width:fit-content;margin-top:4px}

.modal-back{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:99;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;width:min(640px,94vw);max-height:90vh;border-radius:12px;padding:24px;overflow-y:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,0.2)}
.modal h3{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:#475569}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

.settings-section{margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:16px}
.settings-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.settings-title{font-weight:700;font-size:14px;color:#0f172a;margin-bottom:8px}
.team-config-row{display:grid;grid-template-columns:1fr 60px 40px;gap:8px;align-items:center;margin-bottom:8px}
.color-picker-wrapper{height:34px;display:flex;align-items:center}
.color-picker-wrapper input{width:100%;height:100%;padding:0;border:1px solid var(--line);cursor:pointer;border-radius:4px}

.toast{position:fixed;right:24px;bottom:24px;background:#0f172a;color:#fff;border-radius:7px;padding:12px 18px;font-size:13px;opacity:0;transform:translateY(10px);transition:.2s;z-index:200}
.toast.show{opacity:1;transform:none}
.footer-note{color:var(--muted);font-size:12px;margin-top:14px;text-align:right}
.setting-check-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.lunar-label{font-size:9px;color:#7c3f00;line-height:1.05;margin-top:1px}

.g-corner,.g-day-th{height:76px!important;min-height:76px!important;overflow:hidden}
.g-day-th{justify-content:flex-start!important;gap:1px;line-height:1.05;padding:5px 2px!important}
.g-day-th b{font-size:14px;line-height:16px}.g-day-th>span:not(.day-badge):not(.lunar-label){font-size:11px;line-height:13px}
.day-badge{font-size:10px;line-height:12px;margin-top:1px}.lunar-label{display:block;font-size:9px;line-height:11px;margin-top:1px;white-space:nowrap}
.g-event-card{position:relative!important;box-sizing:border-box!important;margin-left:2px!important;margin-right:2px!important;width:calc(100% - 4px)!important;padding:0!important;border-left:0!important;overflow:hidden!important}
.g-event-card .event-text{box-sizing:border-box!important;width:100%!important;padding-left:6px!important;padding-right:6px!important;margin:0!important}
.g-event-card.status-confirmed{border-left:0!important;box-shadow:inset 3px 0 0 var(--confirmed-border),0 2px 6px rgba(15,23,42,.16)!important}
.g-event-card.status-planned{border-left:0!important;box-shadow:0 2px 6px rgba(15,23,42,.16)!important}
.event-pill{position:relative!important;box-sizing:border-box!important;margin-left:2px!important;margin-right:2px!important;padding-left:6px!important;padding-right:6px!important;border-left:0!important;overflow:hidden!important}
.event-pill.status-confirmed{border-left:0!important;box-shadow:inset 3px 0 0 var(--confirmed-border),0 2px 6px rgba(15,23,42,.16)!important}
.event-pill.status-planned{border-left:0!important;box-shadow:0 2px 6px rgba(15,23,42,.16)!important}
.modal{font-size:13px}.modal h3{font-size:18px!important;font-weight:700!important;color:#0f172a!important;line-height:1.3}.modal .field label,.modal .settings-title{font-size:13px!important}.modal input,.modal select,.modal textarea,.modal button,.modal .actions button{font-size:13px!important}
.recycle-row{display:grid;grid-template-columns:1fr 110px 130px 80px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.recycle-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recycle-empty{padding:28px;text-align:center;color:var(--muted)}

.recovery-status{font-size:12px;color:#64748b;display:flex;align-items:center;gap:6px;white-space:nowrap}
.recovery-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;display:inline-block}
.recovery-dot.dirty{background:#d97706}.recovery-dot.warning{background:#dc2626}
.recovery-panel{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.recovery-dialog{background:#fff;width:min(620px,96vw);max-height:88vh;overflow:auto;border-radius:12px;padding:22px;box-shadow:0 24px 60px rgba(15,23,42,.28)}
.recovery-dialog h3{margin:0 0 8px}.recovery-dialog p{color:#64748b;line-height:1.55}
.recovery-item{border:1px solid #e2e8f0;border-radius:8px;padding:11px 12px;margin:8px 0;display:flex;gap:12px;align-items:center}
.recovery-item-main{flex:1}.recovery-item-title{font-weight:700}.recovery-item-meta{font-size:12px;color:#64748b;margin-top:3px}
.recovery-banner{display:none;background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:8px 14px;font-size:12px;align-items:center;gap:10px}
.recovery-banner.show{display:flex}.recovery-banner button{margin-left:auto}

.settings-modal{width:min(860px,96vw)!important;padding:0!important;overflow:hidden!important;display:flex;flex-direction:column;max-height:90vh}
.settings-modal h3{margin:0!important;padding:20px 24px 16px;border-bottom:1px solid var(--line);font-size:18px!important;flex:none}
.settings-layout{display:flex;flex:1;min-height:0}
.settings-nav{width:170px;flex:none;background:#f8fafc;border-right:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.settings-tab{text-align:left;background:transparent;border:0!important;border-left:3px solid transparent!important;border-radius:0!important;padding:10px 18px;font-size:13px;font-weight:500;color:#475569;cursor:pointer;transition:background .12s,color .12s}
.settings-tab:hover{background:#eef2f7;color:#0f172a}
.settings-tab.active{background:#fff;color:var(--red);font-weight:700;border-left-color:var(--red)!important}
.settings-content{flex:1;padding:20px 24px;overflow-y:auto;min-width:0;display:grid}
.settings-pane{grid-area:1 / 1;visibility:hidden;pointer-events:none}
.settings-pane.active{visibility:visible;pointer-events:auto}
.settings-pane .settings-title{margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;color:#0f172a}
.settings-modal > .actions{flex:none;margin:0!important;padding:14px 24px;border-top:1px solid var(--line);background:#fafafa}
</style>
</head>
<body>

<header>
  <div class="logo-box" id="appLogoBox">
    <img id="appLogoImage" alt="Planner Logo" style="display:none" />
    <span id="appLogoFallback" style="background:#2563eb;color:white;font-weight:800;padding:6px 12px;border-radius:4px">TP</span>
  </div>
  <div class="header-title-box">
    <div class="title" id="appMainTitle">Team Planner</div>
    <div class="subtitle" id="appSubtitle">Annual & Monthly Planning Board</div>
  </div>
  <div class="spacer"></div>
  <div class="recovery-status" id="recoveryStatus">
    <span class="recovery-dot" id="recoveryDot"></span>
    <span id="recoveryStatusText" data-i18n="recovery_saved">已建立恢复点</span>
  </div>
  <button id="undoDeleteBtn" class="icon-btn" onclick="undoDelete()" style="display:none"><span data-i18n="undo_delete">↩ 撤销删除</span></button>
  <button class="icon-btn" onclick="openSettings()"><span style="font-size:14px">⚙️</span> <span data-i18n="system_settings">系统设置</span></button>
  <button class="primary" onclick="openModal()"><span data-i18n="new_event">＋ 新建计划</span></button>
</header>

<div class="toolbar">
  <div class="seg">
    <button id="yearBtn" onclick="setView('year')" data-i18n="view_year">年度总览</button>
    <button id="monthBtn" class="active" onclick="setView('month')" data-i18n="view_month">月度排期</button>
  </div>
  <select id="yearSelect" class="year-select" onchange="changeYearFromSelect()"></select>
  <div class="nav-month">
    <button onclick="changeMonth(-1)" title="‹">‹</button>
    <span id="monthLabel">9月</span>
    <button onclick="changeMonth(1)" title="›">›</button>
  </div>

  <div class="ctrl-pill">
    <span data-i18n="col_width">列宽:</span>
    <button class="ctrl-btn" onclick="adjustColWidth(-4)">-</button>
    <span id="colWidthDisplay" style="min-width:32px;text-align:center">48px</span>
    <button class="ctrl-btn" onclick="adjustColWidth(4)">+</button>
  </div>

  <div class="ctrl-pill">
    <span data-i18n="font_size">字号:</span>
    <button class="ctrl-btn" onclick="adjustFontSize(-1)">A-</button>
    <span id="fontSizeDisplay" style="min-width:28px;text-align:center">11px</span>
    <button class="ctrl-btn" onclick="adjustFontSize(1)">A+</button>
  </div>

  <button id="boldToggleBtn" class="toggle-btn active" onclick="toggleBoldMode()" data-i18n="bold_on">粗体: 开</button>
  <button id="wrapToggleBtn" class="toggle-btn" onclick="toggleWrapMode()" data-i18n="wrap_off">换行: 关 (省略)</button>

  <input id="search" class="search" data-i18n-placeholder="search_placeholder" placeholder="搜索计划名称、地点、负责人……" oninput="render()" />
  <div class="spacer"></div>
</div>

<div class="recovery-banner" id="backupReminderBanner">
  <span id="backupReminderText" data-i18n="backup_reminder_default">建议导出项目文件，防止清理浏览器数据后无法恢复。</span>
  <button type="button" onclick="exportData()" data-i18n="backup_now">立即备份</button>
  <button type="button" onclick="dismissBackupReminder()" data-i18n="backup_later">稍后提醒</button>
</div>
<main>
  <div class="team-toggles-bar" id="teamTogglesBar">
    <span class="toggle-title" data-i18n="team_toggles_title">职能团队显示开关:</span>
  </div>

  <div class="legend" id="legend"></div>

  <section class="card">
    <div class="card-head">
      <h2 id="viewTitle">2026 HR 年度总览</h2>
      <small id="countText"></small>
    </div>
    <div id="board"></div>
  </section>

</main>

<div id="hoverPopover">
  <div class="popover-title" id="popTitle"></div>
  <div class="popover-meta">
    <span id="popTeam"></span>
    <span id="popDate"></span>
    <span id="popOwner"></span>
    <span id="popLocation"></span>
    <div id="popTag" class="popover-tag"></div>
  </div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3 id="modalTitle" data-i18n="new_event_title">新建排期</h3>
    <div class="form-grid">
      <div class="field full"><label data-i18n="f_title">事项名称 *</label><input id="fTitle" /></div>
      <div class="field"><label data-i18n="f_team">职能团队 *</label><select id="fTeam"></select></div>
      <div class="field"><label data-i18n="f_owner">负责人 / 协同人员</label><input id="fOwner" /></div>
      <div class="field"><label data-i18n="f_start">开始日期 *</label><input id="fStart" type="date" /></div>
      <div class="field"><label data-i18n="f_end">结束日期 *</label><input id="fEnd" type="date" /></div>
      <div class="field"><label data-i18n="f_status">状态</label>
        <select id="fStatus">

let currentLang = 'zh-CN';
function t(key, params){
  const dict = I18N[currentLang] || I18N['zh-CN'];
  let s = dict[key];
  if(s === undefined) s = (I18N['zh-CN'][key] !== undefined ? I18N['zh-CN'][key] : key);
  if(params){ for(const k in params){ s = String(s).replace(new RegExp('\\{'+k+'\\}','g'), params[k]); } }
  return s;
}

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title = t(el.getAttribute('data-i18n-title')); });
}

function setLanguage(lang){
  if(!I18N[lang]) return;
  currentLang = lang;
  document.documentElement.lang = lang;
  const topSel = document.getElementById('langSelect'); if(topSel) topSel.value = lang;
  const cfgSel = document.getElementById('cfgLanguage'); if(cfgSel) cfgSel.value = lang;
  applyStaticTranslations();
  if(typeof persistProjectCache === 'function'){ try{ persistProjectCache(); }catch(e){} }
  if(typeof applyBranding === 'function') applyBranding();
  if(typeof updateRecoveryStatus === 'function') { /* keep */ }
  if(typeof updateLogoStatus === 'function') updateLogoStatus();
  if(typeof updateBoldBtnUI === 'function') updateBoldBtnUI();
  if(typeof updateWrapBtnUI === 'function') updateWrapBtnUI();
  if(typeof renderTeamToggles === 'function') renderTeamToggles();
  if(typeof renderLegend === 'function') renderLegend();
  if(typeof render === 'function') render();
  if(typeof renderRecycleBin === 'function' && document.getElementById('recycleModal').style.display === 'flex') renderRecycleBin();
  if(typeof toast === 'function') toast(t('toast_language_changed'));
}

    if (!visibleTeamNames.has(e.team)) return false;
    const matchYear = new Date(e.start).getFullYear() === year || new Date(e.end).getFullYear() === year;

  });

function getLunarText(yr,m,d){
  try {
    const parts=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{month:'numeric',day:'numeric'}).formatToParts(new Date(yr,m,d));
    const rawMonth=parts.find(p=>p.type==='month')?.value||'';
    const rawDay=parts.find(p=>p.type==='day')?.value||'';
    const digits={'0':'〇','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};
    const monthNames={'1':'正','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九','10':'十','11':'十一','12':'腊'};
    const dayNames={'1':'初一','2':'初二','3':'初三','4':'初四','5':'初五','6':'初六','7':'初七','8':'初八','9':'初九','10':'初十','11':'十一','12':'十二','13':'十三','14':'十四','15':'十五','16':'十六','17':'十七','18':'十八','19':'十九','20':'二十','21':'廿一','22':'廿二','23':'廿三','24':'廿四','25':'廿五','26':'廿六','27':'廿七','28':'廿八','29':'廿九','30':'三十'};
    const monthKey=String(parseInt(rawMonth,10)); const dayKey=String(parseInt(rawDay,10));
    const cnMonth=monthNames[monthKey]||rawMonth.split('').map(x=>digits[x]||x).join('');
    const cnDay=dayNames[dayKey]||rawDay.split('').map(x=>digits[x]||x).join('');
    return cnMonth+'月'+cnDay;
  } catch(e){ return ''; }
}

function splitIntoTracks(eventsInMonth, days, m, yr) {
  const monthEvts = eventsInMonth.filter(e => {
    const s = new Date(e.start), en = new Date(e.end);
    const sMatch = (s.getFullYear() < yr) || (s.getFullYear() === yr && s.getMonth() <= m);
    const eMatch = (en.getFullYear() > yr) || (en.getFullYear() === yr && en.getMonth() >= m);
    return sMatch && eMatch;
  });
  const processed = monthEvts.map(e => {
    const s = new Date(e.start), en = new Date(e.end);
    const startDay = (s.getFullYear() < yr || s.getMonth() < m) ? 1 : s.getDate();
    const endDay = (en.getFullYear() > yr || en.getMonth() > m) ? days : en.getDate();
    return { ...e, startDay, endDay };
  }).sort((a, b) => a.startDay - b.startDay);
  const tracks = [];
  processed.forEach(e => {
    let placed = false;
    for (let track of tracks) {
      const last = track[track.length - 1];
      if (last.endDay < e.startDay) { track.push(e); placed = true; break; }
    }
    if (!placed) tracks.push([e]);
  });
  return tracks.length > 0 ? tracks : [];
}

function getDayClass(day, m, yr) {
  const dateStr = `${yr}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  const hDict = getHolidaysForYear(yr), aDict = getAdjustedForYear(yr);
  if (showHolidays && Boolean(hDict[dateStr])) return 'holiday';
  if (showAdjusted && Boolean(aDict[dateStr])) return 'workday-adjusted';
  const wd = new Date(yr, m, day).getDay();
  if (showWeekend && (wd === 0 || wd === 6)) return 'weekend';
  return '';
}

function bindGlobalInteractions() {
  document.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const bg = e.target.closest('.g-day-bg'); if (!bg) return;
    isCellMouseDown = true; selectTeam = bg.getAttribute('data-team');
    selectStartDay = +bg.getAttribute('data-day'); selectEndDay = selectStartDay;
    highlightSelectCells();
  });
  document.addEventListener('mouseover', e => {
    if (isDraggingEvent) {
      hasMovedDuringDrag = true;
      const bg = e.target.closest('.g-day-bg') || e.target.closest('.g-event-card');
      if (bg) { dragHoverDay = +bg.getAttribute('data-day') || dragHoverDay; dragHoverTeam = bg.getAttribute('data-team') || dragHoverTeam; highlightDragTargetCells(); }
      return;
    }
    if (isCellMouseDown) {
      const bg = e.target.closest('.g-day-bg');
      if (bg && bg.getAttribute('data-team') === selectTeam) { selectEndDay = +bg.getAttribute('data-day'); highlightSelectCells(); }
    }
  });
  document.addEventListener('mouseup', () => {
    if (isDraggingEvent) {
      clearDragTargetHighlights();
      const deltaDays = dragHoverDay - dragOriginStartDay;
      isDraggingEvent = false;
      if (hasMovedDuringDrag && deltaDays !== 0) applyEventShift(draggedEventId, deltaDays, dragHoverTeam);
      return;
    }
    if (isCellMouseDown) {
      isCellMouseDown = false; clearSelectHighlights();
      const sDay = Math.min(selectStartDay, selectEndDay), eDay = Math.max(selectStartDay, selectEndDay);
      const sDate = `${year}-${String(currentMonth + 1).padStart(2, '0')}-${String(sDay).padStart(2, '0')}`;
      const eDate = `${year}-${String(currentMonth + 1).padStart(2, '0')}-${String(eDay).padStart(2, '0')}`;
      openModal({ team: selectTeam, start: sDate, end: eDate });
    }
  });
}
function highlightDragTargetCells() {
  clearDragTargetHighlights(); if (!dragHoverDay || !dragHoverTeam) return;
  const targetStart = dragHoverDay, targetEnd = dragHoverDay + dragSpanDays - 1;
  document.querySelectorAll(`.g-day-bg[data-team="${dragHoverTeam}"]`).forEach(bg => {
    const d = +bg.getAttribute('data-day');
    if (d >= targetStart && d <= targetEnd) bg.classList.add('drag-target-hover');
  });

function clearDragTargetHighlights() { document.querySelectorAll('.g-day-bg.drag-target-hover').forEach(bg => bg.classList.remove('drag-target-hover')); }
function applyEventShift(eventId, deltaDays, newTeam) {
  const item = events.find(x => x.id === eventId); if (!item) return;
  const sDate = new Date(item.start), eDate = new Date(item.end);
  sDate.setDate(sDate.getDate() + deltaDays); eDate.setDate(eDate.getDate() + deltaDays);
  item.start = formatDate(sDate); item.end = formatDate(eDate); if (newTeam) item.team = newTeam;
  persistEvents(); render();
  toast(t('toast_shift',{title:item.title, start:item.start, end:item.end}));
}
function formatDate(d) { const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return `${y}-${m}-${day}`; }
function highlightSelectCells() {
  clearSelectHighlights();
  const sDay = Math.min(selectStartDay, selectEndDay), eDay = Math.max(selectStartDay, selectEndDay);
  document.querySelectorAll(`.g-day-bg[data-team="${selectTeam}"]`).forEach(bg => {

    if (d >= sDay && d <= eDay) bg.classList.add('drag-selecting');

function handleLogoFile(ev){

function persistAllSettings(){ persistProjectCache(); }

function isColorLight(hex) { const c = hex.substring(1); const rgb = parseInt(c, 16); const r = (rgb >> 16) & 0xff; const g = (rgb >> 8) & 0xff; const b = (rgb >> 0) & 0xff; return (0.2126*r + 0.7152*g + 0.0722*b) > 180; }
function saveTeamsToLocal() { localStorage.setItem('hr_planner_teams_global', JSON.stringify(teams)); }
function persistEvents() { localStorage.setItem('hr_planner_events_global', JSON.stringify(events)); }

function safeProjectFileName(value){ return String(value || 'Team-Planner-Project').trim().replace(/[\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').slice(0,80) || 'Team-Planner-Project'; }
function fileTimestamp(d=new Date()){ const pad = n => String(n).padStart(2,'0'); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; }
function exportData(){
  persistProjectCache();
  const payload = JSON.parse(JSON.stringify(currentProject)); payload.metadata.exportedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = safeProjectFileName(payload.metadata.projectName || appTitle) + '_' + fileTimestamp() + '.tplanner.json';
  a.click(); URL.revokeObjectURL(a.href); toast(t('toast_exported'));

function openImportFilePicker(){ const input = $('jsonFileInput'); input.value = ''; input.click(); }
function validateImportedData(data){
  if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('root must be object');
  const source = data.schemaVersion === 'TeamPlannerProject/1.19' || data.metadata ? data : {...data, branding:{title:data.title,subtitle:data.subtitle,logo:data.logo,logoType:data.logoType}, settings:data};
  if (!Array.isArray(source.events)) throw new Error('missing events array');
  if (source.teams !== undefined && !Array.isArray(source.teams)) throw new Error('teams must be array');
  const target = migrateTeams(source.teams || teams), names = new Set(target.map(tm => tm.name.toLowerCase())), ids = new Set();
  source.events.forEach((e, i) => {
    const row = i + 1;
    if (!e || typeof e !== 'object') throw new Error(`item ${row} not object`);
    if (e.id === undefined || e.id === null || e.id === '') throw new Error(`item ${row} missing id`);
    if (ids.has(String(e.id))) throw new Error(`duplicate id ${e.id}`);
    ids.add(String(e.id));
    if (typeof e.title !== 'string' || !e.title.trim()) throw new Error(`item ${row} missing title`);
    const tm = normalizeTeamName(e.team, target);
    if (!names.has(tm.toLowerCase())) throw new Error(`item ${row} team ${e.team||'(empty)'} not found`);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e.start || '') || !/^\d{4}-\d{2}-\d{2}$/.test(e.end || '')) throw new Error(`item ${row} date format must be YYYY-MM-DD`);
    if (e.end < e.start) throw new Error(`item ${row} end before start`);
  });
  return true;
}
async function importJSONFile(ev){
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  const lower = file.name.toLowerCase();
  if (!(lower.endsWith('.json') || lower.endsWith('.tplanner.json'))) return alert(t('alert_import_type'));
  if (file.size > 5*1024*1024) return alert(t('alert_import_size'));
  const backup = JSON.parse(JSON.stringify(currentProject));
  try {
    const raw = JSON.parse(await file.text()); validateImportedData(raw);
    const imported = normalizeProject(raw); validateImportedData(imported);
    currentProject = imported; teams = currentProject.teams; events = currentProject.events;
    recycleBin = currentProject.recycleBin; lastDeletedEvent = recycleBin.length ? recycleBin[recycleBin.length-1] : null;
    appTitle = currentProject.branding.title; appSubtitle = currentProject.branding.subtitle;
    appLogo = currentProject.branding.logo; appLogoType = currentProject.branding.logoType;
    currentColWidth = currentProject.settings.colWidth; currentFontSize = currentProject.settings.fontSize;
    isWrapMode = currentProject.settings.isWrapMode; isBoldMode = currentProject.settings.isBoldMode;
    showLunar = currentProject.settings.showLunar; showWeekend = currentProject.settings.showWeekend;
    showHolidays = currentProject.settings.showHolidays; showAdjusted = currentProject.settings.showAdjusted;
    currentLang = currentProject.settings.language || 'zh-CN';
    document.documentElement.lang = currentLang;
    const topSel = $('langSelect'); if (topSel) topSel.value = currentLang;
    persistProjectCache(); applyBranding(); applyStaticTranslations();
    applyColWidth(currentColWidth); applyFontSize(currentFontSize);
    updateWrapBtnUI(); updateBoldBtnUI(); updateRecycleCount(); closeSettings();
    renderTeamToggles(); renderLegend(); render();
    toast(t('toast_import_ok',{n:events.length}));
  } catch(err) {
    currentProject = normalizeProject(backup); teams = currentProject.teams; events = currentProject.events;
    recycleBin = currentProject.recycleBin; appTitle = currentProject.branding.title;
    appSubtitle = currentProject.branding.subtitle; appLogo = currentProject.branding.logo;
    appLogoType = currentProject.branding.logoType;
    alert(t('alert_import_fail',{msg:err.message || 'invalid project'}));
  }
}
function addDaysToPlannerDate(dateText, days){
  const parts = String(dateText || '').split('-').map(Number);
  const d = new Date(Date.UTC(parts[0], parts[1]-1, parts[2]));
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0,10);
}
function addCurrentEventToOutlook(){
  const item = events.find(e => e.id === editId); if (!item) return toast(t('toast_need_title_dates'));
  const endExclusive = addDaysToPlannerDate(item.end, 1);
  const body = ['Source: Team Planner', 'Team: ' + (item.team||''), 'Status: ' + (item.status === 'confirmed' ? 'Confirmed' : 'Planned'), 'Owner: ' + (item.owner||''), item.notes ? 'Notes: ' + item.notes : ''].filter(Boolean).join('\n');
  const params = new URLSearchParams({ path:'/calendar/action/compose', rru:'addevent', subject:item.title, startdt:item.start+'T00:00:00', enddt:endExclusive+'T00:00:00', allday:'true', body, location:item.location||'' });
  const url = 'https://outlook.office.com/calendar/deeplink/compose?' + params.toString();
  const popup = window.open(url, '_blank', 'noopener,noreferrer'); if (!popup) location.href = url;
  toast(t('toast_outlook'));
}
function darkenColor(hex, factor = 0.42) {
  const value = (hex || '#64748b').replace('#','');
  if (!/^[0-9a-fA-F]{6}$/.test(value)) return '#334155';
  const r = Math.max(0, Math.round(parseInt(value.slice(0,2),16) * factor));
  const g = Math.max(0, Math.round(parseInt(value.slice(2,4),16) * factor));
  const b = Math.max(0, Math.round(parseInt(value.slice(4,6),16) * factor));
  return `#${[r,g,b].map(v => v.toString(16).padStart(2,'0')).join('')}`;
}
function toast(msg){ $('toast').textContent = msg; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 2200); }

$('modalBack').addEventListener('click', e => { if (e.target === $('modalBack')) closeModal(); });

/* RECOVERY_MANAGER_BUILD_01E */
const RECOVERY_KEY='hr_planner_recovery_v119';
const RECOVERY_META_KEY='hr_planner_recovery_meta_v119';
const SNAPSHOT_PREFIX='hr_planner_backup_v119_';
const SNAPSHOT_COUNT=5;
const SNAPSHOT_INTERVAL_MS=10*60*1000;
const RECOVERY_DEBOUNCE_MS=1200;
const EXPORT_REMINDER_CHANGES=20;
const EXPORT_REMINDER_MS=24*60*60*1000;
let recoverySaveTimer=null, recoveryDirty=false, recoveryChangeCount=0, lastSnapshotAt=0, suppressRecoveryTracking=false;

function recoveryNow(){ return new Date().toISOString(); }
function recoveryClone(value){ return JSON.parse(JSON.stringify(value)); }
function recoveryMeta(){ try { return JSON.parse(localStorage.getItem(RECOVERY_META_KEY)||'{}')||{}; } catch(e){ return {}; } }
function writeRecoveryMeta(patch){ const next = {...recoveryMeta(), ...patch}; localStorage.setItem(RECOVERY_META_KEY, JSON.stringify(next)); return next; }
function recoveryProjectName(project=currentProject){ return project?.metadata?.projectName || project?.branding?.title || 'Team Planner Project'; }
function recoveryTimeText(value){ if (!value) return '--'; const d = new Date(value); return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString(currentLang, { hour12:false }); }
function updateRecoveryStatus(mode='saved', text){ const dot = document.getElementById('recoveryDot'); const label = document.getElementById('recoveryStatusText'); if (dot) dot.className = 'recovery-dot' + (mode==='dirty'?' dirty':mode==='warning'?' warning':''); if (label) label.textContent = text || t('recovery_saved'); }
function buildRecoveryEnvelope(reason='change'){ syncProjectModel(); return { format:'TeamPlannerRecovery/1.19', savedAt:recoveryNow(), reason, project:recoveryClone(currentProject) }; }
function writeRecoveryCache(reason='change'){
  if (suppressRecoveryTracking) return;
  try {
    const envelope = buildRecoveryEnvelope(reason);
    localStorage.setItem(RECOVERY_KEY, JSON.stringify(envelope));
    localStorage.setItem(PROJECT_CACHE_KEY, JSON.stringify(envelope.project));
    recoveryDirty = false;
    writeRecoveryMeta({ lastRecoveryAt:envelope.savedAt, changeCount:recoveryChangeCount });
    updateRecoveryStatus('saved', t('recovery_saved'));
    maybeCreateSnapshot(envelope); evaluateBackupReminder();
  } catch(err) { updateRecoveryStatus('warning', t('recovery_cache_broken')); console.error('Recovery save failed', err); }
}
function scheduleRecoverySave(reason='change'){
  if (suppressRecoveryTracking) return;
  recoveryDirty = true; recoveryChangeCount += 1; updateRecoveryStatus('dirty', '...');
  clearTimeout(recoverySaveTimer);
  recoverySaveTimer = setTimeout(() => writeRecoveryCache(reason), RECOVERY_DEBOUNCE_MS);
}
function createSnapshot(envelope=buildRecoveryEnvelope('snapshot')){
  const snapshots = loadSnapshots();
  const entry = { format:'TeamPlannerSnapshot/1.19', savedAt:envelope.savedAt||recoveryNow(), project:recoveryClone(envelope.project) };
  snapshots.unshift(entry);
  snapshots.slice(0, SNAPSHOT_COUNT).forEach((item, index) => localStorage.setItem(SNAPSHOT_PREFIX + (index+1), JSON.stringify(item)));
  for (let i = snapshots.length + 1; i <= SNAPSHOT_COUNT; i++) localStorage.removeItem(SNAPSHOT_PREFIX + i);
  lastSnapshotAt = Date.now(); writeRecoveryMeta({ lastSnapshotAt:entry.savedAt });
}
function maybeCreateSnapshot(envelope){ const meta = recoveryMeta(); const previous = Date.parse(meta.lastSnapshotAt||0)||lastSnapshotAt||0; if (Date.now() - previous >= SNAPSHOT_INTERVAL_MS) createSnapshot(envelope); }
function loadSnapshots(){ const list = []; for (let i = 1; i <= SNAPSHOT_COUNT; i++) { try { const value = JSON.parse(localStorage.getItem(SNAPSHOT_PREFIX + i)||'null'); if (value?.project) list.push(value); } catch(e){} } return list.sort((a,b) => Date.parse(b.savedAt||0) - Date.parse(a.savedAt||0)); }
function readRecoveryEnvelope(){ const raw = localStorage.getItem(RECOVERY_KEY); if (!raw) return { state:'missing' }; try { const value = JSON.parse(raw); if (!value?.project) throw new Error('no project'); validateImportedData(value.project); return { state:'valid', value }; } catch(error){ return { state:'corrupt', error }; } }
function applyRecoveredProject(project, sourceLabel){
  suppressRecoveryTracking = true;
  try {
    const restored = normalizeProject(recoveryClone(project)); validateImportedData(restored);
    currentProject = restored; teams = restored.teams; events = restored.events; recycleBin = restored.recycleBin || [];
    lastDeletedEvent = recycleBin.length ? recycleBin[recycleBin.length-1] : null;
    appTitle = restored.branding.title; appSubtitle = restored.branding.subtitle; appLogo = restored.branding.logo; appLogoType = restored.branding.logoType;
    currentColWidth = restored.settings.colWidth; currentFontSize = restored.settings.fontSize;
    isWrapMode = restored.settings.isWrapMode; isBoldMode = restored.settings.isBoldMode;
    showLunar = restored.settings.showLunar; showWeekend = restored.settings.showWeekend;
    showHolidays = restored.settings.showHolidays; showAdjusted = restored.settings.showAdjusted;
    currentLang = restored.settings.language || 'zh-CN'; document.documentElement.lang = currentLang;
    const topSel = document.getElementById('langSelect'); if (topSel) topSel.value = currentLang;
    applyBranding(); applyStaticTranslations(); applyColWidth(currentColWidth); applyFontSize(currentFontSize);
    updateWrapBtnUI(); updateBoldBtnUI(); updateRecycleCount(); renderTeamToggles(); renderLegend(); render();
    localStorage.setItem(PROJECT_CACHE_KEY, JSON.stringify(currentProject));
  } finally { suppressRecoveryTracking = false; }
  writeRecoveryCache('restored'); closeRecoveryPanel(); toast(t('recovery_from', { src:sourceLabel }));
}
function openRecoveryPanel(title, message, items){
  document.getElementById('recoveryPanelTitle').textContent = title;
  document.getElementById('recoveryPanelMessage').textContent = message;
  const list = document.getElementById('recoveryList'); list.innerHTML = '';
  items.forEach(item => {
    const row = document.createElement('div'); row.className = 'recovery-item';
    const main = document.createElement('div'); main.className = 'recovery-item-main';
    main.innerHTML = '<div class="recovery-item-title"></div><div class="recovery-item-meta"></div>';
    main.querySelector('.recovery-item-title').textContent = item.title;
    main.querySelector('.recovery-item-meta').textContent = item.meta;
    const button = document.createElement('button'); button.className = 'primary'; button.textContent = t('recycle_restore'); button.onclick = item.onRestore;
    row.append(main, button); list.appendChild(row);
  });
  document.getElementById('recoveryPanel').style.display = 'flex';
}
function closeRecoveryPanel(){ document.getElementById('recoveryPanel').style.display = 'none'; }
function detectRecoveryAtStartup(){
  const recovery = readRecoveryEnvelope();
  const snapshots = loadSnapshots();
  const currentModified = Date.parse(currentProject?.metadata?.modifiedAt || 0) || 0;
  if (recovery.state === 'valid') {
    const recoveryModified = Date.parse(recovery.value.project?.metadata?.modifiedAt || recovery.value.savedAt || 0) || 0;
    if (recoveryModified > currentModified + 1000) {
      openRecoveryPanel(t('recovery_new_found'), t('recovery_new_desc'), [{ title:recoveryProjectName(recovery.value.project), meta:t('recovery_saved_at',{time:recoveryTimeText(recovery.value.savedAt)}), onRestore:() => applyRecoveredProject(recovery.value.project, t('recovery_point')) }]);
      return;
    }
  }
  if (recovery.state === 'corrupt' && snapshots.length) {
    openRecoveryPanel(t('recovery_corrupt'), t('recovery_corrupt_desc'), snapshots.map((s,i) => ({ title:recoveryProjectName(s.project), meta:t('recovery_snapshot') + ' ' + (i+1) + ' · ' + t('recovery_saved_at',{time:recoveryTimeText(s.savedAt)}), onRestore:() => applyRecoveredProject(s.project, t('recovery_snapshot')) })));
  } else if (recovery.state === 'corrupt') {
    updateRecoveryStatus('warning', t('recovery_cache_broken'));
  }
}
function evaluateBackupReminder(){
  const meta = recoveryMeta();
  const lastExport = Date.parse(meta.lastExportAt || 0) || 0;
  const dueByChanges = recoveryChangeCount >= EXPORT_REMINDER_CHANGES;
  const dueByTime = !lastExport || Date.now() - lastExport >= EXPORT_REMINDER_MS;
  const dismissedUntil = Date.parse(meta.reminderDismissedUntil || 0) || 0;
  const banner = document.getElementById('backupReminderBanner'); if (!banner) return;
  const shouldShow = (dueByChanges || dueByTime) && Date.now() > dismissedUntil;
  banner.classList.toggle('show', shouldShow);
  if (shouldShow) {
    document.getElementById('backupReminderText').textContent = dueByChanges ? t('backup_due_changes') : t('backup_due_time');
  }
}
function dismissBackupReminder(){ writeRecoveryMeta({ reminderDismissedUntil: new Date(Date.now() + 4*60*60*1000).toISOString() }); document.getElementById('backupReminderBanner')?.classList.remove('show'); }
function recordSuccessfulExport(){ recoveryChangeCount = 0; writeRecoveryMeta({ lastExportAt:recoveryNow(), changeCount:0, reminderDismissedUntil:null }); document.getElementById('backupReminderBanner')?.classList.remove('show'); }
function flushRecoveryBeforeExit(){ if (recoveryDirty) { clearTimeout(recoverySaveTimer); writeRecoveryCache('page-exit'); } }

const originalPersistProjectCache = persistProjectCache;
persistProjectCache = function(){ scheduleRecoverySave('project-change'); };
saveTeamsToLocal = function(){ scheduleRecoverySave('team-change'); };
persistEvents = function(){ scheduleRecoverySave('event-change'); };
persistBranding = function(){ scheduleRecoverySave('branding-change'); };
persistAllSettings = function(){ scheduleRecoverySave('settings-change'); };
const originalExportData = exportData;
exportData = function(){ flushRecoveryBeforeExit(); originalExportData(); recordSuccessfulExport(); };
window.addEventListener('beforeunload', flushRecoveryBeforeExit);
setInterval(() => { if (recoveryDirty) writeRecoveryCache('interval'); else maybeCreateSnapshot(buildRecoveryEnvelope('scheduled-snapshot')); }, SNAPSHOT_INTERVAL_MS);
setTimeout(() => { const meta = recoveryMeta(); recoveryChangeCount = Number(meta.changeCount)||0; detectRecoveryAtStartup(); evaluateBackupReminder(); if (!localStorage.getItem(RECOVERY_KEY)) writeRecoveryCache('initial'); }, 0);

init();
