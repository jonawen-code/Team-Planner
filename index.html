<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Planner</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo-box" id="appLogoBox">
    <img id="appLogoImage" alt="Planner Logo" style="display:none" />
    <span id="appLogoFallback" style="background:#2563eb;color:white;font-weight:800;padding:6px 12px;border-radius:4px">TP</span>
  </div>
  <div class="header-title-box">
    <div class="title" id="appMainTitle">Team Planner</div>
    <div class="subtitle" id="appSubtitle">Annual & Monthly Planning Board</div>
  </div>
  <div class="spacer"></div>
  <div class="recovery-status" id="recoveryStatus">
    <span class="recovery-dot" id="recoveryDot"></span>
    <span id="recoveryStatusText" data-i18n="recovery_saved">已建立恢复点</span>
  </div>
  <button id="undoDeleteBtn" class="icon-btn" onclick="undoDelete()" style="display:none"><span data-i18n="undo_delete">↩ 撤销删除</span></button>
  <button class="icon-btn" onclick="openSettings()"><span style="font-size:14px">⚙️</span> <span data-i18n="system_settings">系统设置</span></button>
  <button class="primary" onclick="openModal()"><span data-i18n="new_event">＋ 新建计划</span></button>
</header>

<div class="toolbar">
  <div class="seg">
    <button id="yearBtn" onclick="setView('year')" data-i18n="view_year">年度总览</button>
    <button id="monthBtn" class="active" onclick="setView('month')" data-i18n="view_month">月度排期</button>
  </div>
  <select id="yearSelect" class="year-select" onchange="changeYearFromSelect()"></select>
  <div class="nav-month">
    <button onclick="changeMonth(-1)" title="‹">‹</button>
    <span id="monthLabel">9月</span>
    <button onclick="changeMonth(1)" title="›">›</button>
  </div>
  <div class="ctrl-pill">
    <span data-i18n="col_width">列宽:</span>
    <button class="ctrl-btn" onclick="adjustColWidth(-4)">-</button>
    <span id="colWidthDisplay" style="min-width:32px;text-align:center">48px</span>
    <button class="ctrl-btn" onclick="adjustColWidth(4)">+</button>
  </div>
  <div class="ctrl-pill">
    <span data-i18n="font_size">字号:</span>
    <button class="ctrl-btn" onclick="adjustFontSize(-1)">A-</button>
    <span id="fontSizeDisplay" style="min-width:28px;text-align:center">11px</span>
    <button class="ctrl-btn" onclick="adjustFontSize(1)">A+</button>
  </div>
  <button id="boldToggleBtn" class="toggle-btn active" onclick="toggleBoldMode()" data-i18n="bold_on">粗体: 开</button>
  <button id="wrapToggleBtn" class="toggle-btn" onclick="toggleWrapMode()" data-i18n="wrap_off">换行: 关 (省略)</button>
  <input id="search" class="search" data-i18n-placeholder="search_placeholder" placeholder="搜索计划名称、地点、负责人……" oninput="render()" />
  <div class="spacer"></div>
</div>

<div class="recovery-banner" id="backupReminderBanner">
  <span id="backupReminderText" data-i18n="backup_reminder_default">建议导出项目文件，防止清理浏览器数据后无法恢复。</span>
  <button type="button" onclick="exportData()" data-i18n="backup_now">立即备份</button>
  <button type="button" onclick="dismissBackupReminder()" data-i18n="backup_later">稍后提醒</button>
</div>

<main>
  <div class="team-toggles-bar" id="teamTogglesBar">
    <span class="toggle-title" data-i18n="team_toggles_title">职能团队显示开关:</span>
  </div>
  <div class="legend" id="legend"></div>
  <section class="card">
    <div class="card-head">
      <h2 id="viewTitle">2026 HR 年度总览</h2>
      <small id="countText"></small>
    </div>
    <div id="board"></div>
  </section>
</main>

<div id="hoverPopover">
  <div class="popover-title" id="popTitle"></div>
  <div class="popover-meta">
    <span id="popTeam"></span>
    <span id="popDate"></span>
    <span id="popOwner"></span>
    <span id="popLocation"></span>
    <div id="popTag" class="popover-tag"></div>
  </div>
</div>

<div class="modal-back" id="modalBack"></div>
<div class="modal-back" id="settingsModal"></div>
<div class="modal-back" id="recycleModal"></div>
<div class="toast" id="toast"></div>
<div class="recovery-panel" id="recoveryPanel"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
