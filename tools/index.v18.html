<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Planner V18</title>
<style>
:root{
  --red:#d50022;--red-dark:#b0001a;--ink:#1e293b;--muted:#64748b;--line:#cbd5e1;--bg:#f1f5f9;--panel:#fff;
  --holiday-bg:#cbd5e1;
  --weekend-bg:#e2e8f0;
  --workday-bg:#ffffff;
  --adjusted-workday:#fef3c7;
  
  --col-w: 48px;
  --label-w: 140px;
  --item-font-size: 11px;
}
*{box-sizing:border-box} 
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);user-select:none}

header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:50}
.logo-box{display:flex;align-items:center;height:36px}
.logo-box img{height:32px;object-fit:contain}
.header-title-box{margin-left:4px}
.title{font-weight:800;font-size:18px;color:#0f172a}
.subtitle{color:var(--muted);font-size:12px;margin-top:2px}
.spacer{flex:1}

button,select,input,textarea{font:inherit} 
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;color:#334155;transition:all .15s}
button:hover{background:#f8fafc;border-color:#94a3b8;color:#0f172a}
.primary{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.primary:hover{background:var(--red-dark);border-color:var(--red-dark);color:#fff}
.danger{color:#dc2626;border-color:#fecaca}
.danger:hover{background:#fef2f2;border-color:#f87171}
.icon-btn{padding:6px 10px;display:flex;align-items:center;gap:5px}

.toolbar{background:#fff;padding:8px 24px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:64px;z-index:45}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px}
.seg button.active{background:#0f172a;color:#fff}
.nav-year{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
.nav-year button{padding:4px 9px}
.year-select{padding:5px 28px 5px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:800;color:#0f172a}
.nav-month{display:flex;align-items:center;gap:6px;font-weight:700}
.nav-month button{padding:4px 9px}
#monthLabel{min-width:42px;text-align:center}
.search{padding:6px 11px;border:1px solid var(--line);border-radius:6px;min-width:190px}

.ctrl-pill{display:flex;align-items:center;gap:4px;background:#f8fafc;padding:3px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px}
.ctrl-pill span{color:var(--muted);font-weight:600}
.ctrl-btn{padding:2px 7px;font-size:11px;font-weight:700;line-height:1}
.toggle-btn{padding:3px 9px;font-size:11px;font-weight:600;border-radius:4px;border:1px solid var(--line);background:#fff;cursor:pointer}
.toggle-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}

main{padding:14px 24px 40px}

.team-toggles-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;background:#fff;padding:8px 16px;border-radius:8px;border:1px solid var(--line)}
.toggle-title{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px}
.team-pill-btn{
  display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
  border:1px solid var(--line);background:#f8fafc;color:#64748b;cursor:pointer;transition:all .15s
}
.team-pill-btn.active{color:#fff;border-color:transparent}
.team-pill-btn .check-icon{font-size:11px}

.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;background:#fff;padding:7px 16px;border-radius:8px;border:1px solid var(--line);font-size:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-weight:500}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.status-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:4px;background:#f8fafc;border:1px solid var(--line)}
.status-box{width:14px;height:12px;border-radius:2px;background:#94a3b8}
.hint{margin-left:auto;color:var(--muted);font-size:12px}

.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.03);overflow:hidden}
.card-head{padding:10px 18px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#fafafa}
.card-head h2{font-size:15px;margin:0;font-weight:700}
.card-head small{color:var(--muted);margin-left:10px}

/* 年度总览 */
.scroll{overflow:auto}
.year-grid{display:grid;grid-template-columns:140px repeat(12,minmax(90px,1fr));min-width:1220px}
.cell{min-height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;position:relative}
.headcell{min-height:36px;background:#f1f5f9;font-weight:700;text-align:center;padding:9px 4px;position:sticky;top:0;z-index:4;color:#475569;font-size:13px}
.teamcell{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;background:#f8fafc;position:sticky;left:0;z-index:3;border-right:2px solid var(--line)}

.event-pill{
  color:#fff;border-radius:4px;padding:4px 7px;margin:3px 0;font-size:11px;line-height:1.3;
  cursor:pointer;box-shadow:0 2px 6px rgba(15,23,42,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-sizing:border-box;
}
.event-pill.light{color:#1e293b}
.event-pill.status-confirmed{border-left:3px solid var(--confirmed-border) !important}
.event-pill.status-planned{border-left:5px solid transparent !important}

/* 月度 CSS Grid 布局 */
.month-wrap{overflow:auto;position:relative;background:#fff}
.grid-calendar{
  display: grid;
  grid-template-columns: var(--label-w) repeat(var(--total-days), var(--col-w));
  border-left: 1px solid var(--line);
  border-top: 1px solid var(--line);
  width: max-content;
}

.g-cell{
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.g-corner{
  grid-column: 1;
  grid-row: 1;
  position: sticky;
  left: 0;
  top: 0;
  z-index: 35;
  background: #e2e8f0;
  font-weight: 700;
  font-size: 13px;
  height: 76px;
}
.g-day-th{
  grid-row: 1;
  position: sticky;
  top: 0;
  z-index: 30;
  background: #f1f5f9;
  height: 76px;
  font-size: 11px;
  color: #475569;
  flex-direction: column;
  padding: 4px 2px;
}
.g-day-th b{display:block;font-size:14px;color:#0f172a}
.g-day-th.weekend{background:var(--weekend-bg)}
.g-day-th.holiday{background:var(--holiday-bg);color:#991b1b;font-weight:700}
.g-day-th.workday-adjusted{background:var(--adjusted-workday);color:#92400e}
.day-badge{font-size:10px;font-weight:700;line-height:1;margin-top:2px;display:block}

.g-team-label{
  grid-column: 1;
  position: sticky;
  left: 0;
  z-index: 25;
  background: #f8fafc;
  font-weight: 700;
  font-size: 13px;
  padding: 0 12px;
  justify-content: flex-start;
  gap: 8px;
  border-right: 2px solid var(--line);
}

.g-day-bg{
  cursor: crosshair;
  background: #fff;
  height: 100%;
}
.g-day-bg.weekend{background:rgba(226,232,240,0.65)}
.g-day-bg.holiday{background:rgba(203,213,225,0.95)}
.g-day-bg.workday-adjusted{background:rgba(254,243,199,0.5)}
.g-day-bg.drag-selecting{background:rgba(213,0,34,0.3) !important}
.g-day-bg.drag-target-hover{background:rgba(59,130,246,0.35) !important}

.g-event-card{
  height: calc(100% - 8px);
  align-self: center;
  border-radius: 5px;
  color: #fff;
  font-size: var(--item-font-size);
  display: flex;
  align-items: center;
  padding: 0 6px;
  margin-left: 1px;
  margin-right: 1px;
  box-shadow: 0 2px 6px rgba(15,23,42,0.16);
  cursor: grab;
  z-index: 10;
  box-sizing: border-box;
  margin-top: 4px;
  margin-bottom: 4px;
  transition: filter .15s, transform .1s;
}
.g-event-card:active{cursor:grabbing}
.g-event-card:hover{
  filter:brightness(0.92);
  transform:translateY(-1px);
  box-shadow:0 3px 6px rgba(0,0,0,0.22);
}
.g-event-card.light{color:#1e293b}

.g-event-card.status-confirmed{border-left:3px solid var(--confirmed-border) !important}
.g-event-card.status-planned{border-left:5px solid transparent !important}

.font-bold-mode{font-weight:700 !important}
.font-normal-mode{font-weight:500 !important}

.event-text.ellipsis-mode{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  width:100%;
  text-align:left;
}
.event-text.wrap-mode{
  white-space:normal;
  word-break:normal;
  overflow-wrap:normal;
  hyphens:none;
  line-height:1.2;
  text-align:center;
  width:100%;
}

#hoverPopover{
  position:fixed;
  display:none;
  z-index:999;
  background:#ffffff;
  color:#1e293b;
  border-radius:8px;
  padding:12px 14px;
  box-shadow:0 12px 28px -4px rgba(0,0,0,0.18), 0 4px 12px -2px rgba(0,0,0,0.08);
  border:1px solid #e2e8f0;
  border-left:4px solid var(--red);
  max-width:320px;
  min-width:180px;
  pointer-events:none;
  transition:opacity .12s ease, transform .12s ease;
  opacity:0;
  transform:translateY(4px);
}
#hoverPopover.show{
  opacity:1;
  transform:translateY(0);
}
.popover-title{
  font-weight:700;
  font-size:13px;
  color:#0f172a;
  margin-bottom:6px;
  line-height:1.3;
}
.popover-meta{
  font-size:11px;
  color:#64748b;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.popover-meta span b{color:#334155;font-weight:600}
.popover-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;width:fit-content;margin-top:4px}

.modal-back{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:99;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;width:min(640px,94vw);max-height:90vh;border-radius:12px;padding:24px;overflow-y:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,0.2)}
.modal h3{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:#475569}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

.settings-section{margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:16px}
.settings-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.settings-title{font-weight:700;font-size:14px;color:#0f172a;margin-bottom:8px}
.team-config-row{display:grid;grid-template-columns:1fr 60px 40px;gap:8px;align-items:center;margin-bottom:8px}
.color-picker-wrapper{height:34px;display:flex;align-items:center}
.color-picker-wrapper input{width:100%;height:100%;padding:0;border:1px solid var(--line);cursor:pointer;border-radius:4px}

.toast{position:fixed;right:24px;bottom:24px;background:#0f172a;color:#fff;border-radius:7px;padding:12px 18px;font-size:13px;opacity:0;transform:translateY(10px);transition:.2s;z-index:200}
.toast.show{opacity:1;transform:none}
.footer-note{color:var(--muted);font-size:12px;margin-top:14px;text-align:right}
.setting-check-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.lunar-label{font-size:9px;color:#7c3f00;line-height:1.05;margin-top:1px}
/* V16.2 definitive overrides */
.g-corner,.g-day-th{height:76px!important;min-height:76px!important;overflow:hidden}
.g-day-th{justify-content:flex-start!important;gap:1px;line-height:1.05;padding:5px 2px!important}
.g-day-th b{font-size:14px;line-height:16px}.g-day-th>span:not(.day-badge):not(.lunar-label){font-size:11px;line-height:13px}
.day-badge{font-size:10px;line-height:12px;margin-top:1px}.lunar-label{display:block;font-size:9px;line-height:11px;margin-top:1px;white-space:nowrap}
/* Item gap and true symmetric text inset */
.g-event-card{position:relative!important;box-sizing:border-box!important;margin-left:2px!important;margin-right:2px!important;width:calc(100% - 4px)!important;padding:0!important;border-left:0!important;overflow:hidden!important}
.g-event-card .event-text{box-sizing:border-box!important;width:100%!important;padding-left:6px!important;padding-right:6px!important;margin:0!important}
.g-event-card.status-confirmed{border-left:0!important;box-shadow:inset 3px 0 0 var(--confirmed-border),0 2px 6px rgba(15,23,42,.16)!important}
.g-event-card.status-planned{border-left:0!important;box-shadow:0 2px 6px rgba(15,23,42,.16)!important}
.event-pill{position:relative!important;box-sizing:border-box!important;margin-left:2px!important;margin-right:2px!important;padding-left:6px!important;padding-right:6px!important;border-left:0!important;overflow:hidden!important}
.event-pill.status-confirmed{border-left:0!important;box-shadow:inset 3px 0 0 var(--confirmed-border),0 2px 6px rgba(15,23,42,.16)!important}
.event-pill.status-planned{border-left:0!important;box-shadow:0 2px 6px rgba(15,23,42,.16)!important}
/* Modal typography */
.modal{font-size:13px}.modal h3{font-size:18px!important;font-weight:700!important;color:#0f172a!important;line-height:1.3}.modal .field label,.modal .settings-title{font-size:13px!important}.modal input,.modal select,.modal textarea,.modal button,.modal .actions button{font-size:13px!important}
.recycle-row{display:grid;grid-template-columns:1fr 110px 130px 80px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.recycle-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recycle-empty{padding:28px;text-align:center;color:var(--muted)}</style>
</head>
<body>

<header>
  <div class="logo-box" id="appLogoBox">
    <img id="appLogoImage" alt="Planner Logo" style="display:none" />
    <span id="appLogoFallback" style="background:#2563eb;color:white;font-weight:800;padding:6px 12px;border-radius:4px">TP</span>
  </div>
  <div class="header-title-box">
    <div class="title" id="appMainTitle">Team Planner</div>
    <div class="subtitle" id="appSubtitle">Annual & Monthly Planning Board</div>
  </div>
  <div class="spacer"></div>
  <button id="undoDeleteBtn" class="icon-btn" onclick="undoDelete()" style="display:none">↩ 撤销删除</button>
  <button class="icon-btn" onclick="openSettings()"><span style="font-size:14px">⚙️</span> 系统设置</button>
  <button class="primary" onclick="openModal()">＋ 新建计划</button>
</header>

<div class="toolbar">
  <div class="seg">
    <button id="yearBtn" onclick="setView('year')">年度总览</button>
    <button id="monthBtn" class="active" onclick="setView('month')">月度排期</button>
  </div>
  <select id="yearSelect" class="year-select" onchange="changeYearFromSelect()"></select>
  <div class="nav-month">
    <button onclick="changeMonth(-1)" title="上一个月">‹</button>
    <span id="monthLabel">9月</span>
    <button onclick="changeMonth(1)" title="下一个月">›</button>
  </div>

  <!-- 1. 列宽微调 -->
  <div class="ctrl-pill" title="调整每天的列宽度">
    <span>列宽:</span>
    <button class="ctrl-btn" onclick="adjustColWidth(-4)">-</button>
    <span id="colWidthDisplay" style="min-width:32px;text-align:center">48px</span>
    <button class="ctrl-btn" onclick="adjustColWidth(4)">+</button>
  </div>

  <!-- 2. 字号微调 -->
  <div class="ctrl-pill" title="调整文字字号">
    <span>字号:</span>
    <button class="ctrl-btn" onclick="adjustFontSize(-1)">A-</button>
    <span id="fontSizeDisplay" style="min-width:28px;text-align:center">11px</span>
    <button class="ctrl-btn" onclick="adjustFontSize(1)">A+</button>
  </div>

  <!-- 3. 粗体开关 -->
  <button id="boldToggleBtn" class="toggle-btn active" onclick="toggleBoldMode()" title="切换排期文字粗体或正常字重">
    粗体: 开
  </button>

  <!-- 4. 换行模式开关 -->
  <button id="wrapToggleBtn" class="toggle-btn" onclick="toggleWrapMode()" title="切换单行省略截断还是多行完整显示">
    换行: 关 (省略)
  </button>

  <input id="search" class="search" placeholder="搜索计划名称、地点、负责人……" oninput="render()" />
  <div class="spacer"></div>
</div>

<main>
  <div class="team-toggles-bar" id="teamTogglesBar">
    <span class="toggle-title">职能团队显示开关:</span>
  </div>

  <div class="legend" id="legend"></div>

  <section class="card">
    <div class="card-head">
      <h2 id="viewTitle">2026 HR 年度总览</h2>
      <small id="countText"></small>
    </div>
    <div id="board"></div>
  </section>

</main>

<div id="hoverPopover">
  <div class="popover-title" id="popTitle"></div>
  <div class="popover-meta">
    <span id="popTeam"></span>
    <span id="popDate"></span>
    <span id="popOwner"></span>
    <span id="popLocation"></span>
    <div id="popTag" class="popover-tag"></div>
  </div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3 id="modalTitle">新建排期</h3>
    <div class="form-grid">
      <div class="field full"><label>事项名称 *</label><input id="fTitle" placeholder="如 Training Plan A" /></div>
      <div class="field"><label>职能团队 *</label><select id="fTeam"></select></div>
      <div class="field"><label>负责人 / 协同人员 (悬停气泡中查看)</label><input id="fOwner" placeholder="如 张三 / 李四 / John" /></div>
      <div class="field"><label>开始日期 *</label><input id="fStart" type="date" /></div>
      <div class="field"><label>结束日期 *</label><input id="fEnd" type="date" /></div>
      <div class="field"><label>状态</label>
        <select id="fStatus">
          <option value="planned">Planned</option>
          <option value="confirmed">Confirmed</option>
        </select>
      </div>
      <div class="field"><label>地点 / 形式</label><input id="fLocation" placeholder="Office / Virtual" /></div>
      <div class="field full"><label>备注详细</label><textarea id="fNotes" rows="3" placeholder="添加补充说明..."></textarea></div>
    </div>
    <div class="actions">
      <button id="deleteBtn" class="danger" onclick="deleteEvent()" style="margin-right:auto;display:none">删除此排期</button>
      <button id="outlookBtn" onclick="addCurrentEventToOutlook()" style="display:none">📅 添加到 Outlook</button>
      <button onclick="closeModal()">取消</button>
      <button class="primary" onclick="saveEvent()">保存</button>
    </div>
  </div>
</div>

<div class="modal-back" id="settingsModal">
  <div class="modal" style="width:min(680px,94vw)">
    <h3>⚙️ 全局与团队设置中心</h3>
    
    <div class="settings-section">
      <div class="settings-title">基础配置</div>
      <div class="field full">
        <label>系统看板标题</label>
        <input id="cfgAppTitle" value="Team Planner" placeholder="例如 Team Planner" />
      </div>
      <div class="field full">
        <label>副标题</label>
        <input id="cfgAppSubtitle" value="Annual & Monthly Planning Board" placeholder="可留空" />
      </div>
      <div class="field full">
        <label>Logo 外部图片链接</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="cfgLogoUrl" type="url" placeholder="https://example.com/logo.png" style="flex:1" />
          <button type="button" onclick="applyLogoUrlFromSettings()">应用链接</button>
        </div>
      </div>
      <div class="field full">
        <label>或上传本地 Logo（PNG / JPG / SVG / WebP，最大 1 MB）</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button type="button" onclick="openLogoFilePicker()">选择本地图片</button>
          <button type="button" onclick="clearCustomLogo()">恢复默认 Logo</button>
          <span id="logoStatus" style="font-size:12px;color:var(--muted)">当前使用默认 Logo</span>
          <input id="logoFileInput" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="display:none" onchange="handleLogoFile(event)" />
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-title">日历增强配置</div>
      <label class="setting-check-row"><span>显示农历（月度视图）</span><input id="cfgShowLunar" type="checkbox" /></label>

const defaultTeams = [
  { name:'Team A', color:'#c9142b', light:false, visible:true },

];

const verifiedFullYearEvents = [];

const LEGACY_TEAM_MAP={LD:'L&D',ENG:'Engagement',ELC:'TA',MEET:'Meeting',CB:'C&B'};
function normalizeTeamName(v,list=teams){const raw=String(v||'').trim();if(!raw)return '';const exact=(list||[]).find(t=>String(t.name||'').trim().toLowerCase()===raw.toLowerCase());if(exact)return exact.name;return LEGACY_TEAM_MAP[raw.toUpperCase()]||raw;}
function migrateTeams(raw){const source=Array.isArray(raw)?raw:defaultTeams,seen=new Set();return source.map(t=>{const sourceName=t.name||LEGACY_TEAM_MAP[String(t.id||'').toUpperCase()]||t.id;const name=normalizeTeamName(sourceName,defaultTeams);return {name,color:t.color||'#6366f1',light:typeof t.light==='boolean'?t.light:isColorLight(t.color||'#6366f1'),visible:t.visible!==false};}).filter(t=>t.name&&!seen.has(t.name.toLowerCase())&&(seen.add(t.name.toLowerCase()),true));}
let teams=migrateTeams(JSON.parse(localStorage.getItem('hr_planner_teams_global')||localStorage.getItem('hr_planner_teams_v13')||'null')||defaultTeams);
let events=JSON.parse(localStorage.getItem('hr_planner_events_global')||localStorage.getItem('hr_planner_events_v13')||'null')||verifiedFullYearEvents;
events=events.map(e=>({...e,team:normalizeTeamName(e.team,teams),status:e.status==='confirmed'?'confirmed':'planned'}));
const requiredTeamNames=new Set(events.map(e=>e.team).filter(Boolean));requiredTeamNames.forEach(name=>{if(!teams.some(t=>t.name===name)){const base=defaultTeams.find(t=>t.name===name);teams.push(base?{...base}:{name,color:'#6366f1',light:false,visible:true});}});
// Explicit repair confirmed by user
const lab1=events.find(e=>String(e.id)==='404'&&e.title==='Leading a Team Lab 1'&&e.start==='2026-04-20');if(lab1)lab1.team='L&D';
localStorage.setItem('hr_planner_teams_global',JSON.stringify(teams));localStorage.setItem('hr_planner_events_global',JSON.stringify(events));
let appTitle = localStorage.getItem('hr_planner_title_global') || localStorage.getItem('hr_planner_title_v13') || 'Team Planner';
let appSubtitle = localStorage.getItem('hr_planner_subtitle_global') || 'Annual & Monthly Planning Board';
let appLogo = localStorage.getItem('hr_planner_logo_global') || '';
let appLogoType = localStorage.getItem('hr_planner_logo_type_global') || '';

let currentColWidth = +localStorage.getItem('hr_planner_colwidth_global') || 48;
let currentFontSize = +localStorage.getItem('hr_planner_fontsize_global') || 11;
let isWrapMode = localStorage.getItem('hr_planner_wrapmode_global') === 'true';
let isBoldMode = localStorage.getItem('hr_planner_boldmode_global') !== 'false';

let showWeekend = localStorage.getItem('hr_planner_show_weekend_global') !== 'false';
let showHolidays = localStorage.getItem('hr_planner_show_holidays_global') !== 'false';
let showAdjusted = localStorage.getItem('hr_planner_show_adjusted_global') !== 'false';

let view = 'month', year = 2026, currentMonth = 8, editId = null;
let recycleBin=JSON.parse(localStorage.getItem('hr_planner_recycle_bin_global')||'[]').map(e=>({...e,team:normalizeTeamName(e.team,teams)}));
let lastDeletedEvent=recycleBin.length?recycleBin[recycleBin.length-1]:null;
localStorage.setItem('hr_planner_recycle_bin_global',JSON.stringify(recycleBin));

const $ = id => document.getElementById(id);

let isDraggingEvent = false;
let draggedEventId = null;
let dragOriginStartDay = null;
let dragSpanDays = null;
let dragHoverDay = null;
let dragHoverTeam = null;

let isCellMouseDown = false;
let selectTeam = null;
let selectStartDay = null;
let selectEndDay = null;

function init() {

function renderLegend() {
  const leg = $('legend');
  leg.innerHTML = '';
  teams.filter(t => t.visible !== false).forEach(t => {
    leg.insertAdjacentHTML('beforeend', `<span class="legend-item"><i class="dot" style="background:${t.color}"></i>${t.name}</span>`);
  });

    <span class="status-legend-item"><span class="status-box" style="border-left:4px solid transparent"></span>Planned</span>
    <span class="hint">年份下拉选择；月份箭头切换；按住卡片拖拽平移日期；空白格拖选新建</span>

function filtered() {
  const q = $('search').value.trim().toLowerCase();
  const visibleTeamNames = new Set(teams.filter(t => t.visible !== false).map(t => t.name));

  return events.filter(e => {
    if (!visibleTeamNames.has(e.team)) return false;
    const matchYear = new Date(e.start).getFullYear() === year || new Date(e.end).getFullYear() === year;
    const matchQ = !q || [e.title, e.owner, e.location, e.status, e.notes].join(' ').toLowerCase().includes(q);
    return matchYear && matchQ;
  });
}

function render() {
  $('yearSelect').value = year;
  $('monthLabel').textContent = `${currentMonth + 1}月`;
  $('viewTitle').textContent = view === 'year' ? `${year} HR 年度总览` : `${year}年 ${currentMonth + 1}月排期`;
  const list = filtered();
  $('countText').textContent = `${list.length} 项排期`;

  view === 'year' ? renderYear(list) : renderMonth(list);
}

function renderYear(list) {
  let h = '<div class="scroll"><div class="year-grid"><div class="cell headcell">职能团队</div>' +
    Array.from({length: 12}, (_, i) => `<div class="cell headcell">${i + 1}月</div>`).join('');
  
  teams.filter(t => t.visible !== false).forEach(t => {
    h += `<div class="cell teamcell"><i class="dot" style="background:${t.color}"></i>${t.name}</div>`;
    for (let m = 0; m < 12; m++) {
      const es = list.filter(e => {
        if (e.team !== t.name) return false;
        const s = new Date(e.start), en = new Date(e.end);
        return (s.getFullYear() === year && s.getMonth() <= m) && (en.getFullYear() === year && en.getMonth() >= m);
      });
      h += `<div class="cell">${es.map(e => `
        <div class="event-pill ${t.light ? 'light' : ''} status-${e.status || 'confirmed'} ${isBoldMode ? 'font-bold-mode' : 'font-normal-mode'}" style="background:${t.color};--confirmed-border:${darkenColor(t.color, 0.42)}" 
             onclick="editEvent(${e.id})" 
             onmouseenter="showHoverCard(event, ${e.id})"
             onmouseleave="hideHoverCard()">
          ${e.title}
        </div>`).join('')}</div>`;
    }
  });
  h += '</div></div>';
  $('board').innerHTML = h;
}

// 核心修复：绝对精确计算每个月第一天是星期几 (JS getDay: 0=Sun, 1=Mon... -> 转换成 1=Mon...7=Sun)
function getLunarText(yr,m,d){
  try {
    const parts=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{month:'numeric',day:'numeric'}).formatToParts(new Date(yr,m,d));
    const rawMonth=parts.find(p=>p.type==='month')?.value||'';
    const rawDay=parts.find(p=>p.type==='day')?.value||'';
    const digits={'0':'〇','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};
    const monthNames={'1':'正','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九','10':'十','11':'十一','12':'腊'};
    const dayNames={'1':'初一','2':'初二','3':'初三','4':'初四','5':'初五','6':'初六','7':'初七','8':'初八','9':'初九','10':'初十','11':'十一','12':'十二','13':'十三','14':'十四','15':'十五','16':'十六','17':'十七','18':'十八','19':'十九','20':'二十','21':'廿一','22':'廿二','23':'廿三','24':'廿四','25':'廿五','26':'廿六','27':'廿七','28':'廿八','29':'廿九','30':'三十'};
    const monthKey=String(parseInt(rawMonth,10));
    const dayKey=String(parseInt(rawDay,10));
    const cnMonth=monthNames[monthKey]||rawMonth.split('').map(x=>digits[x]||x).join('');
    const cnDay=dayNames[dayKey]||rawDay.split('').map(x=>digits[x]||x).join('');
    return cnMonth+'月'+cnDay;
  } catch(e){ return ''; }
}
function getFirstDayOfWeek(yr, m) {
  const d = new Date(yr, m, 1).getDay();
  return d === 0 ? 7 : d; // 周一为1，周日为7
}

function renderMonth(list) {
  const m = currentMonth;
  const yr = year;
  const days = new Date(yr, m + 1, 0).getDate();
  const monthEvents = list.filter(e => {
    const s = new Date(e.start), en = new Date(e.end);
    const sMatch = (s.getFullYear() < yr) || (s.getFullYear() === yr && s.getMonth() <= m);
    const eMatch = (en.getFullYear() > yr) || (en.getFullYear() === yr && en.getMonth() >= m);
    return sMatch && eMatch;
  });

  const visibleTeams = teams.filter(t => t.visible !== false);

  const teamTracksMap = {};
  visibleTeams.forEach(t => {
    const teamEvts = monthEvents.filter(e => e.team === t.name);
    teamTracksMap[t.name] = splitIntoTracks(teamEvts, days, m, yr);
  });

  let totalRows = 0;
  visibleTeams.forEach(t => {
    totalRows += Math.max(1, teamTracksMap[t.name].length);
  });

  let h = `<div class="month-wrap"><div class="grid-calendar" style="--total-days: ${days}; grid-template-rows: 76px repeat(${totalRows}, minmax(46px, auto));">`;

  // 1. 左上角 Corner
  h += `<div class="g-cell g-corner">职能团队</div>`;

  // 2. 日期表头 (1 ~ days)
  for (let d = 1; d <= days; d++) {
    const dateStr = `${yr}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const hDict = getHolidaysForYear(yr);
    const aDict = getAdjustedForYear(yr);
    const holidayName = hDict[dateStr];
    const adjustedText = aDict[dateStr];

    const wd = new Date(yr, m, d).getDay();
    const isWk = (wd === 0 || wd === 6);

    let cls = '';
    let badge = '';
    if (holidayName && showHolidays) {
      cls = 'holiday';
      badge = `<span class="day-badge">${holidayName}</span>`;
    } else if (adjustedText && showAdjusted) {
      cls = 'workday-adjusted';
      badge = `<span class="day-badge">班</span>`;
    } else if (isWk && showWeekend) {
      cls = 'weekend';
    }

    h += `<div class="g-cell g-day-th ${cls}" style="grid-column: ${d + 1}; grid-row: 1;">
      <b>${d}</b>
      <span>${['日','一','二','三','四','五','六'][wd]}</span>
      ${badge}
      ${showLunar ? `<span class="lunar-label">${getLunarText(yr,m,d)}</span>` : ''}
    </div>`;
  }

  // 3. 渲染各个团队泳道与背景网格
  let currentRow = 2;
  visibleTeams.forEach(t => {
    const tracks = teamTracksMap[t.name];
    const teamRowCount = Math.max(1, tracks.length);
    const startRow = currentRow;
    const endRow = currentRow + teamRowCount;

    h += `<div class="g-cell g-team-label" style="grid-column: 1; grid-row: ${startRow} / ${endRow};">
      <i class="dot" style="background:${t.color}"></i>
      <span>${t.name}</span>
    </div>`;

    for (let d = 1; d <= days; d++) {
      const cls = getDayClass(d, m, yr);
      for (let r = 0; r < teamRowCount; r++) {
        h += `<div class="g-cell g-day-bg ${cls}" 
                   style="grid-column: ${d + 1}; grid-row: ${startRow + r};"
                   data-team="${t.name}"
                   data-day="${d}"></div>`;
      }
    }

    tracks.forEach((trackEvents, rIdx) => {
      const rNum = startRow + rIdx;
      trackEvents.forEach(item => {
        const gridColStart = item.startDay + 1;
        const gridColEnd = item.endDay + 2;
        const statusClass = `status-${item.status || 'confirmed'}`;
        const boldClass = isBoldMode ? 'font-bold-mode' : 'font-normal-mode';

        h += `
          <div class="g-event-card ${t.light ? 'light' : ''} ${statusClass} ${boldClass}" 
               style="background: ${t.color}; --confirmed-border:${darkenColor(t.color, 0.42)}; grid-column: ${gridColStart} / ${gridColEnd}; grid-row: ${rNum};"
               onclick="onCardClick(event, ${item.id})"
               onmouseenter="showHoverCard(event, ${item.id})"
               onmouseleave="hideHoverCard()"
               data-event-id="${item.id}"
               onmousedown="startDragEventMove(event, ${item.id}, encodeURIComponent('${t.name}'), ${item.startDay}, ${item.endDay - item.startDay + 1})">
            <div class="event-text ${isWrapMode ? 'wrap-mode' : 'ellipsis-mode'}">
              ${item.title}
            </div>
          </div>
        `;
      });
    });

    currentRow = endRow;
  });

  h += `</div></div>`;
  $('board').innerHTML = h;
}

function splitIntoTracks(eventsInMonth, days, m, yr) {
  const monthEvts = eventsInMonth.filter(e => {
    const s = new Date(e.start), en = new Date(e.end);
    const sMatch = (s.getFullYear() < yr) || (s.getFullYear() === yr && s.getMonth() <= m);
    const eMatch = (en.getFullYear() > yr) || (en.getFullYear() === yr && en.getMonth() >= m);
    return sMatch && eMatch;
  });

  const processed = monthEvts.map(e => {
    const s = new Date(e.start), en = new Date(e.end);
    const startDay = (s.getFullYear() < yr || s.getMonth() < m) ? 1 : s.getDate();
    const endDay = (en.getFullYear() > yr || en.getMonth() > m) ? days : en.getDate();
    return { ...e, startDay, endDay };
  }).sort((a, b) => a.startDay - b.startDay);

  const tracks = [];
  processed.forEach(e => {
    let placed = false;
    for (let track of tracks) {
      const last = track[track.length - 1];
      if (last.endDay < e.startDay) {
        track.push(e);
        placed = true;
        break;
      }
    }
    if (!placed) {
      tracks.push([e]);
    }
  });

  return tracks.length > 0 ? tracks : [];
}

function getDayColorHex(day, m, yr) {
  const dateStr = `${yr}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  const hDict = getHolidaysForYear(yr);
  const aDict = getAdjustedForYear(yr);

  if (showHolidays && Boolean(hDict[dateStr])) return 'rgba(203, 213, 225, 0.95)';
  if (showAdjusted && Boolean(aDict[dateStr])) return 'rgba(254, 243, 199, 0.5)';

  const wd = new Date(yr, m, day).getDay();
  if (showWeekend && (wd === 0 || wd === 6)) return 'rgba(226, 232, 240, 0.65)';

  return '#ffffff';
}

function getDayClass(day, m, yr) {
  const dateStr = `${yr}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  const hDict = getHolidaysForYear(yr);
  const aDict = getAdjustedForYear(yr);

  if (showHolidays && Boolean(hDict[dateStr])) return 'holiday';
  if (showAdjusted && Boolean(aDict[dateStr])) return 'workday-adjusted';

  const wd = new Date(yr, m, day).getDay();
  if (showWeekend && (wd === 0 || wd === 6)) return 'weekend';
  return '';
}

  draggedEventId = id;

  dragSpanDays = span;
  dragHoverDay = startDay;
  dragHoverTeam = decodeURIComponent(teamName);
  hasMovedDuringDrag = false;

function bindGlobalInteractions() {
  document.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const bg = e.target.closest('.g-day-bg');
    if (!bg) return;

    isCellMouseDown = true;
    selectTeam = bg.getAttribute('data-team');
    selectStartDay = +bg.getAttribute('data-day');
    selectEndDay = selectStartDay;
    highlightSelectCells();
  });

  document.addEventListener('mouseover', e => {
    if (isDraggingEvent) {
      hasMovedDuringDrag = true;
      const bg = e.target.closest('.g-day-bg') || e.target.closest('.g-event-card');
      if (bg) {
        dragHoverDay = +bg.getAttribute('data-day') || dragHoverDay;
        dragHoverTeam = bg.getAttribute('data-team') || dragHoverTeam;
        highlightDragTargetCells();
      }
      return;
    }

    if (isCellMouseDown) {
      const bg = e.target.closest('.g-day-bg');
      if (bg && bg.getAttribute('data-team') === selectTeam) {
        selectEndDay = +bg.getAttribute('data-day');
        highlightSelectCells();
      }
    }
  });

  document.addEventListener('mouseup', () => {
    if (isDraggingEvent) {
      clearDragTargetHighlights();
      const deltaDays = dragHoverDay - dragOriginStartDay;
      isDraggingEvent = false;

      if (hasMovedDuringDrag && deltaDays !== 0) {
        applyEventShift(draggedEventId, deltaDays, dragHoverTeam);
      }
      return;
    }

    if (isCellMouseDown) {
      isCellMouseDown = false;
      clearSelectHighlights();

      const sDay = Math.min(selectStartDay, selectEndDay);
      const eDay = Math.max(selectStartDay, selectEndDay);

      const sDate = `${year}-${String(currentMonth + 1).padStart(2, '0')}-${String(sDay).padStart(2, '0')}`;
      const eDate = `${year}-${String(currentMonth + 1).padStart(2, '0')}-${String(eDay).padStart(2, '0')}`;

      openModal({ team: selectTeam, start: sDate, end: eDate });
    }
  });
}

function highlightDragTargetCells() {
  clearDragTargetHighlights();
  if (!dragHoverDay || !dragHoverTeam) return;

  const targetStart = dragHoverDay;
  const targetEnd = dragHoverDay + dragSpanDays - 1;

  document.querySelectorAll(`.g-day-bg[data-team="${dragHoverTeam}"]`).forEach(bg => {
    const d = +bg.getAttribute('data-day');
    if (d >= targetStart && d <= targetEnd) {
      bg.classList.add('drag-target-hover');
    }
  });
}

function clearDragTargetHighlights() {

function applyEventShift(eventId, deltaDays, newTeam) {
  const item = events.find(x => x.id === eventId);
  if (!item) return;

  const sDate = new Date(item.start);
  const eDate = new Date(item.end);

  sDate.setDate(sDate.getDate() + deltaDays);
  eDate.setDate(eDate.getDate() + deltaDays);

  item.start = formatDate(sDate);
  item.end = formatDate(eDate);
  if (newTeam) item.team = newTeam;

  persistEvents();
  render();
  toast(`排期已平移：${item.title} 调整为 ${item.start} 至 ${item.end}`);
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function highlightSelectCells() {

    const d = +bg.getAttribute('data-day');

function isColorLight(hex) {
  const c = hex.substring(1);
  const rgb = parseInt(c, 16);
  const r = (rgb >> 16) & 0xff;
  const g = (rgb >>  8) & 0xff;
  const b = (rgb >>  0) & 0xff;
  const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return luma > 180;
}

  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);const now=new Date(),ymd=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0'),key='hr_planner_export_seq_'+ymd,seq=Number(localStorage.getItem(key)||0)+1;localStorage.setItem(key,String(seq));a.download='HRPlannerFullConfig'+year+ymd+String(seq).padStart(2,'0')+'.JSON';a.click();URL.revokeObjectURL(a.href);toast('已导出 V18 全量配置');
}

function openImportFilePicker() {
  const input = $('jsonFileInput');
  input.value = '';
  input.click();

function validateImportedData(data){if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('文件根节点必须是JSON对象');if(!Array.isArray(data.events))throw new Error('缺少events数组');if(data.teams!==undefined&&!Array.isArray(data.teams))throw new Error('teams必须是数组');const target=migrateTeams(data.teams||teams),names=new Set(target.map(t=>t.name.toLowerCase())),ids=new Set();data.events.forEach((e,i)=>{const row=i+1;if(!e||typeof e!=='object')throw new Error(`第 ${row} 项排期不是对象`);if(e.id===undefined||e.id===null||e.id==='')throw new Error(`第 ${row} 项缺少id`);if(ids.has(String(e.id)))throw new Error(`发现重复id：${e.id}`);ids.add(String(e.id));if(typeof e.title!=='string'||!e.title.trim())throw new Error(`第 ${row} 项缺少有效标题`);const team=normalizeTeamName(e.team,target);if(!names.has(team.toLowerCase()))throw new Error(`第 ${row} 项团队 ${e.team||'(空)'} 不存在`);if(!/^\d{4}-\d{2}-\d{2}$/.test(e.start||'')||!/^\d{4}-\d{2}-\d{2}$/.test(e.end||''))throw new Error(`第 ${row} 项日期格式必须为YYYY-MM-DD`);if(e.end<e.start)throw new Error(`第 ${row} 项结束日期早于开始日期`);});return true;}
async function importJSONFile(ev) {
  const file=ev.target.files&&ev.target.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.json'))return alert('导入失败：请选择.json文件');if(file.size>5*1024*1024)return alert('导入失败：JSON文件不能超过5MB');
  try{const data=JSON.parse(await file.text());validateImportedData(data);const targetTeams=migrateTeams(data.teams||teams),normalizedEvents=data.events.map(e=>({...e,title:e.title.trim(),team:normalizeTeamName(e.team,targetTeams),owner:typeof e.owner==='string'?e.owner.trim():'',location:typeof e.location==='string'?e.location.trim():'',notes:typeof e.notes==='string'?e.notes.trim():'',status:e.status==='confirmed'?'confirmed':'planned'}));validateImportedData({...data,teams:targetTeams,events:normalizedEvents});
    data.events.forEach((src,i)=>{const out=normalizedEvents[i];if(String(src.id)!==String(out.id)||src.title.trim()!==out.title||src.start!==out.start||src.end!==out.end)throw new Error(`第 ${i+1} 项标准化一致性校验失败`);});
    const backup={events:JSON.parse(JSON.stringify(events)),teams:JSON.parse(JSON.stringify(teams)),title:appTitle,subtitle:appSubtitle,logo:appLogo,logoType:appLogoType};try{
      events=normalizedEvents;teams=targetTeams;
      if(typeof data.title==='string'&&data.title.trim())appTitle=data.title.trim();
      if(typeof data.subtitle==='string')appSubtitle=data.subtitle.trim();
      if(typeof data.logo==='string'){appLogo=data.logo;appLogoType=data.logoType==='file'?'file':(data.logo?'url':'');}
      if(Number.isFinite(Number(data.colWidth)))currentColWidth=Math.min(80,Math.max(34,Number(data.colWidth)));
      if(Number.isFinite(Number(data.fontSize)))currentFontSize=Math.min(14,Math.max(9,Number(data.fontSize)));
      if(typeof data.isWrapMode==='boolean')isWrapMode=data.isWrapMode;
      if(typeof data.isBoldMode==='boolean')isBoldMode=data.isBoldMode;
      if(typeof data.showLunar==='boolean')showLunar=data.showLunar;
      if(typeof data.showWeekend==='boolean')showWeekend=data.showWeekend;
      if(typeof data.showHolidays==='boolean')showHolidays=data.showHolidays;
      if(typeof data.showAdjusted==='boolean')showAdjusted=data.showAdjusted;
      persistEvents();saveTeamsToLocal();persistAllSettings();applyBranding();applyColWidth(currentColWidth);applyFontSize(currentFontSize);updateWrapBtnUI();updateBoldBtnUI();closeSettings();renderTeamToggles();renderLegend();render();toast(`JSON导入成功：${events.length}项排期`);
    }catch(err){events=backup.events;teams=backup.teams;appTitle=backup.title;appSubtitle=backup.subtitle;appLogo=backup.logo;appLogoType=backup.logoType;persistEvents();saveTeamsToLocal();applyBranding();throw err;}}
  catch(err){alert(`导入失败：${err.message||'JSON文件无效'}\n原数据未被修改。`);}
}
function addDaysToPlannerDate(dateText,days){
  const parts=String(dateText||'').split('-').map(Number);
  const d=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function addCurrentEventToOutlook(){
  const item=events.find(e=>e.id===editId);
  if(!item)return toast('请先打开一个已有排期');
  const start=item.start;
  const endExclusive=addDaysToPlannerDate(item.end,1);
  const body=[
    '来源：Team Planner',
    '职能团队：'+(item.team||''),
    '状态：'+(item.status==='confirmed'?'Confirmed':'Planned'),
    '负责人 / 协同人员：'+(item.owner||'未填写'),
    item.notes?'备注：'+item.notes:''
  ].filter(Boolean).join('\n');
  const params=new URLSearchParams({
    path:'/calendar/action/compose',
    rru:'addevent',
    subject:item.title,
    startdt:start+'T00:00:00',
    enddt:endExclusive+'T00:00:00',
    allday:'true',
    body,
    location:item.location||''
  });
  const url='https://outlook.office.com/calendar/deeplink/compose?'+params.toString();
  const popup=window.open(url,'_blank','noopener,noreferrer');
  if(!popup)location.href=url;
  toast('已打开 Outlook，请检查后选择保存');
}
function darkenColor(hex, factor = 0.42) {
  const value = (hex || '#64748b').replace('#','');
  if (!/^[0-9a-fA-F]{6}$/.test(value)) return '#334155';
  const r = Math.max(0, Math.round(parseInt(value.slice(0,2),16) * factor));
  const g = Math.max(0, Math.round(parseInt(value.slice(2,4),16) * factor));
  const b = Math.max(0, Math.round(parseInt(value.slice(4,6),16) * factor));
  return `#${[r,g,b].map(v => v.toString(16).padStart(2,'0')).join('')}`;
}
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  setTimeout(() => $('toast').classList.remove('show'), 2200);
}
